# Serves the React build and proxies the backends, so the browser talks to a single origin.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream analytics { server analytics-service:8090; }
upstream producer  { server producer-service:8081; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # resolve upstreams at request time is not needed: compose DNS names are stable

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/generator {
        proxy_pass http://producer;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://analytics;
        proxy_set_header Host $host;
    }

    # STOMP over WebSocket
    location /ws {
        proxy_pass http://analytics;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
