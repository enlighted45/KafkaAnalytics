server:
  port: ${ANALYTICS_PORT:8090}

spring:
  application:
    name: analytics-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092,localhost:29092,localhost:39092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      isolation-level: read-committed
      properties:
        spring.deserializer.value.delegate.class: com.bank.txn.common.serde.TransactionEventDeserializer
    streams:
      application-id: txn-analytics
      replication-factor: ${STREAMS_REPLICATION_FACTOR:3}
      state-dir: ${STREAMS_STATE_DIR:${java.io.tmpdir}/txn-analytics-state}
      properties:
        processing.guarantee: exactly_once_v2     # no double counting on failover / restart
        commit.interval.ms: 1000                  # fewer transactions + store flushes; dashboard reads stores directly
        topic.min.insync.replicas: ${STREAMS_MIN_ISR:2}
        num.stream.threads: 2
        statestore.cache.max.bytes: 10485760
        windowstore.changelog.additional.retention.ms: 60000    # default is 1 day; keeps changelogs and restores small
        # Streams' EOS default is 10 s. A broker hand-off or a multi-second host stall then aborts the
        # transaction, fences the producer and forces a state wipe + restore (minutes). 60 s rides it out.
        producer.transaction.timeout.ms: 60000

analytics:
  window-size: 10s
  summary-window-size: 1m
  grace: 30s
  high-value-threshold-inr: 100000
  velocity-threshold: 10
  velocity-window: 1m
  dedupe-retention: 2m          # client retries arrive within seconds; shorter = smaller changelog / faster restore
  live-feed-max-per-second: 20
  chart-history: 5m
  summary-history: 30m
  push-interval-ms: 1000
  health-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
