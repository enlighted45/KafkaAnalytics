name: txn-analytics

# ---------------------------------------------------------------------------
# Kafka: 3 nodes, each broker + KRaft controller.
#  - partitions: RF=3 -> 1 leader + 2 followers, leaders spread over the 3 brokers
#  - controller quorum: 1 active controller + 2 standby followers
#  - min.insync.replicas=2 + acks=all -> survives 1 broker failure without data loss
# ---------------------------------------------------------------------------
x-kafka-common: &kafka-common
  image: ${KAFKA_IMAGE:-apache/kafka:4.4.0}
  restart: unless-stopped
  stop_grace_period: 60s   # allow controlled shutdown (leadership hand-off) instead of SIGKILL after 10s
  networks: [txn-net]
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 15s
    timeout: 15s
    retries: 10
    start_period: 30s

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_HEAP_OPTS: ${KAFKA_HEAP:--Xms512m -Xmx512m}

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports: ["19092:19092"]
    volumes: [kafka-1-data:/var/lib/kafka/data]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports: ["29092:29092"]
    volumes: [kafka-2-data:/var/lib/kafka/data]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    ports: ["39092:39092"]
    volumes: [kafka-3-data:/var/lib/kafka/data]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092

  # One-shot job: creates topics with RF=3 / min.insync.replicas=2
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.4.0}
    container_name: kafka-init
    networks: [txn-net]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    volumes: [./infra/kafka/create-topics.sh:/create-topics.sh:ro]
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    restart: unless-stopped
    networks: [txn-net]
    ports: ["${KAFKA_UI_PORT:-8080}:8080"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_CLUSTERS_0_NAME: txn-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      DYNAMIC_CONFIG_ENABLED: "false"

  producer-service:
    build:
      context: .
      dockerfile: producer-service/Dockerfile
    image: txn-analytics/producer-service:1.0.0
    container_name: producer-service
    restart: unless-stopped
    stop_grace_period: 60s   # let Kafka Streams / producer close cleanly (no state restore on restart)
    networks: [txn-net]
    ports: ["${PRODUCER_PORT:-8081}:8081"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      GENERATOR_RATE: ${GENERATOR_RATE:-50}
      GENERATOR_AUTOSTART: ${GENERATOR_AUTOSTART:-true}
      JAVA_OPTS: -Xms256m -Xmx384m -XX:+ExitOnOutOfMemoryError

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    image: txn-analytics/analytics-service:1.0.0
    container_name: analytics-service
    restart: unless-stopped
    stop_grace_period: 60s   # let Kafka Streams / producer close cleanly (no state restore on restart)
    networks: [txn-net]
    ports: ["${ANALYTICS_PORT:-8090}:8090"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    volumes: [streams-state:/var/lib/streams]
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      STREAMS_STATE_DIR: /var/lib/streams
      STREAMS_REPLICATION_FACTOR: 3
      STREAMS_MIN_ISR: 2
      JAVA_OPTS: -Xms512m -Xmx768m -XX:+ExitOnOutOfMemoryError

  dashboard:
    build: ./dashboard
    image: txn-analytics/dashboard:1.0.0
    container_name: dashboard
    restart: unless-stopped
    networks: [txn-net]
    ports: ["${DASHBOARD_PORT:-3000}:80"]
    depends_on:
      analytics-service: { condition: service_healthy }
      producer-service: { condition: service_healthy }

networks:
  txn-net:
    name: txn-net

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  streams-state:
